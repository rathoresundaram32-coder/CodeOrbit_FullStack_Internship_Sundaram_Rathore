<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List | CodeOrbit Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>My To-Do List</h1>
        <div class="input-area">
            <input type="text" id="taskInput" placeholder="Enter new task...">
            <button onclick="addTask()">Add</button>
        </div>
        <ul id="taskList"></ul>
        <p class="note">Tasks are saved automatically in your browser (localStorage)</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
